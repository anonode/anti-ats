<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a2533;
            ;
            text-align: center;
            padding: 50px;
        }
        .navbar {
            background-color: #1a2533;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar img {
            height: 50px;
        }
        .navbar-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .navbar-links a:hover {
            background-color: white;
            color: #1a2533;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 5px 25px 25px rgba(0, 0, 0, 0.1);
            width: 40%;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #1a2533;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #23395d;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Anti-ATS Logo">
        <div class="navbar-links">
            <a href="#">FAQs</a>
            <a href="#">How it works</a>
            <a href="{{ url_for('register') }}">Sign up</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>

    <div class="login-container">~
        <h2>Login</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="FN" placeholder="First_name" required><br>
            <input type="text" name="LN" placeholder="Last Name" required><br>
            <input type="text" name="Email" placeholder="Email" required><br>
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <input type="password" name="C_password" placeholder="Confirmed Password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
